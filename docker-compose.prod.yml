# docker-compose.prod.yml — Pull pre-built images from GHCR and run on EC2
# Usage:
#   1. Copy this file, Caddyfile, and .env to your EC2 instance
#   2. podman compose -f docker-compose.prod.yml pull
#   3. podman compose -f docker-compose.prod.yml up -d

services:
  # --- Existing site (jdlab.us) ---
  nextjs:
    image: ghcr.io/dhan78/jdlab:latest
    container_name: jdlab-nextjs
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  # --- Prostore (shop.jdlab.us) ---
  db:
    image: postgres:18.3
    container_name: postgres-prostore
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
      - POSTGRES_DB=neondb
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neondb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/dhan78/prostore:latest
    container_name: prostore-app
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-secret}@db:5432/neondb?schema=public"
      NODE_OPTIONS: ""
      AUTH_TRUST_HOST: "true"
    depends_on:
      db:
        condition: service_healthy

  # --- outline ---
  outline:
    image: outlinewiki/outline:latest
    container_name: outline
    restart: unless-stopped
    expose:
      - "3000"
    env_file: ./outline.env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-secret}@db:5432/outline
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: outline-redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  # --- Reverse proxy (handles both sites + auto HTTPS) ---
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nextjs
      - app
      - outline 

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
